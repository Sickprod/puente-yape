# Compila la app automáticamente en GitHub (gratis): suba esta carpeta a un repositorio y
# descargue el APK desde la pestaña Actions → último trabajo → Artifacts → "VisionPuenteYape-APK".
name: Compilar APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: VisionPuenteYape-APK
          path: app/build/outputs/apk/release/*.apk
